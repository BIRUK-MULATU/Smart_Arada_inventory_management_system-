server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # The app shell and PWA update-check files must never be served stale, or users get stuck
    # on an old build with no way to see the update is available.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything under /assets/ and the workbox helper are content-hashed by Vite, so they're
    # safe to cache forever - a new build always gets a new filename.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
